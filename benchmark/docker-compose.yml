      context: ..
      dockerfile: benchmark/Dockerfile
    cpus: "4.0"
    mem_limit: 512m
    volumes:
      - ./results:/results
    command: ["-n", "100", "-w", "5", "-o", "/results/results_4cpu.json"]

  benchmark-half-cpu:
