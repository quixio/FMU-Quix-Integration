services:
  benchmark-1cpu:
    build:
      context: ..
      dockerfile: benchmark/Dockerfile
    cpus: "1.0"
    mem_limit: 512m
    volumes:
      - ./results:/results
    command: ["-n", "100", "-w", "5", "-o", "/results/results_1cpu.json"]

  benchmark-2cpu:
    build:
      context: ..
      dockerfile: benchmark/Dockerfile
    cpus: "2.0"
    mem_limit: 512m
    volumes:
      - ./results:/results
    command: ["-n", "100", "-w", "5", "-o", "/results/results_2cpu.json"]

  benchmark-4cpu:
