      context: ..
      dockerfile: benchmark/Dockerfile
    cpus: "0.5"
    mem_limit: 512m
    volumes:
      - ./results:/results
    command: ["-n", "100", "-w", "5", "-o", "/results/results_0.5cpu.json"]
