# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: data-source
    application: 2d-vector-data-source
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write into
        required: true
        value: 2d-vector
      - name: ms_to_sleep
        inputType: FreeText
        value: 500
  - name: FMU Integration
    application: fmu-integration
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Name of the input topic to listen to.
        value: 2d-vector
      - name: output
        inputType: OutputTopic
        description: Name of the output topic to write to.
        value: fmu-output
  - name: FMU Explorer
    application: fmu-explorer
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: fmu-explorer
    network:
      ports:
        - port: 80
          targetPort: 80
    variables:
      - name: port
        inputType: FreeText
        description: Port to run the web server on
        value: 80
  - name: Benchmark Compare
    application: benchmark-compare
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: input
        inputType: InputTopic
        description: Topic with benchmark results to compare
        value: benchmark-results
  - name: Benchmark MATLAB
    application: benchmark-matlab
    version: latest
    deploymentType: Service
    resources:
      cpu: 1000
      memory: 5000
      replicas: 1
    variables:
      - name: output
        inputType: OutputTopic
        description: Topic to publish benchmark results to
        required: true
        value: benchmark-results
      - name: iterations
        inputType: FreeText
        description: Number of timed iterations per benchmark scenario
        value: 100
      - name: warmup
        inputType: FreeText
        description: Warmup iterations before timing begins
        value: 5
      - name: run_label
        inputType: FreeText
        description: Label to tag results (e.g. matlab-cpu-1000)
        value: matlab-default

# This section describes the Topics of the data pipeline
topics:
  - name: 2d-vector
  - name: fmu-output
  - name: benchmark-results
