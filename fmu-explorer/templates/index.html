<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FMU Explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #00d9ff;
        }

        .drop-zone {
            max-width: 600px;
            margin: 0 auto 2rem;
            padding: 3rem;
            border: 3px dashed #444;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #16213e;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: #00d9ff;
            background: #1a2a4e;
        }

        .drop-zone p {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .drop-zone small {
            color: #888;
        }

        .drop-zone.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .drop-zone-csv {
            border-color: #4CAF50;
        }

        .drop-zone-csv:hover, .drop-zone-csv.dragover {
            border-color: #8BC34A;
            background: #1a3a2e;
        }

        input[type="file"] {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #00d9ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            max-width: 1200px;
            margin: 0 auto;
            display: none;
        }

        .results.active {
            display: block;
        }

        .model-info {
            background: #16213e;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .model-info h2 {
            color: #00d9ff;
            margin-bottom: 1rem;
        }

        .model-info p {
            margin: 0.5rem 0;
        }

        .model-info span {
            color: #888;
        }

        .variable-section {
            background: #16213e;
            border-radius: 8px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .section-header {
            padding: 1rem 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a2a4e;
        }

        .section-header:hover {
            background: #1f3460;
        }

        .section-header h3 {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .count-badge {
            background: #00d9ff;
            color: #1a1a2e;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .section-content.expanded {
            max-height: 2000px;
        }

        .variable-table, .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .variable-table th,
        .variable-table td,
        .data-table th,
        .data-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        .variable-table th, .data-table th {
            background: #0f1a2e;
            color: #00d9ff;
            font-weight: 600;
        }

        .variable-table tr:hover, .data-table tr:hover {
            background: #1a2a4e;
        }

        .type-badge {
            background: #333;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .error {
            background: #4a1515;
            border: 1px solid #ff4444;
            color: #ff8888;
            padding: 1rem;
            border-radius: 8px;
            max-width: 600px;
            margin: 0 auto 1rem;
            text-align: center;
            display: none;
        }

        .error.active {
            display: block;
        }

        .arrow {
            transition: transform 0.3s ease;
        }

        .arrow.rotated {
            transform: rotate(180deg);
        }

        /* CSV Section */
        .csv-section {
            display: none;
            margin-top: 2rem;
        }

        .csv-section.active {
            display: block;
        }

        .csv-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #00d9ff;
            color: #1a1a2e;
        }

        .btn-primary:hover {
            background: #00b8d4;
        }

        .btn-success {
            background: #4CAF50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn-success:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .validation-status {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .validation-status.active {
            display: block;
        }

        .validation-status.valid {
            background: #1a3a2e;
            border: 1px solid #4CAF50;
            color: #8BC34A;
        }

        .validation-status.invalid {
            background: #3a1a1a;
            border: 1px solid #f44336;
            color: #ff8888;
        }

        .data-section {
            display: none;
            margin-top: 2rem;
        }

        .data-section.active {
            display: block;
        }

        .data-section h3 {
            color: #00d9ff;
            margin-bottom: 1rem;
        }

        .table-container {
            background: #16213e;
            border-radius: 8px;
            overflow-x: auto;
            margin-bottom: 2rem;
        }

        .table-container h4 {
            padding: 1rem;
            background: #1a2a4e;
            margin: 0;
            color: #00d9ff;
        }

        .output-section {
            border-color: #4CAF50;
        }

        .output-section h4 {
            background: #1a3a2e;
            color: #8BC34A;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }

        .step-indicator {
            text-align: center;
            margin-bottom: 1rem;
            color: #888;
        }

        .step-indicator .step {
            display: inline-block;
            padding: 0.5rem 1rem;
            margin: 0 0.5rem;
            border-radius: 20px;
            background: #333;
        }

        .step-indicator .step.active {
            background: #00d9ff;
            color: #1a1a2e;
        }

        .step-indicator .step.completed {
            background: #4CAF50;
            color: white;
        }

        .chart-container {
            background: #16213e;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 2rem;
        }

        .chart-container h4 {
            color: #8BC34A;
            margin-bottom: 1rem;
        }

        .examples-section {
            max-width: 600px;
            margin: 0 auto 2rem;
            text-align: center;
        }

        .examples-section h3 {
            color: #888;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .example-cards {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .example-card {
            background: #16213e;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .example-card:hover {
            border-color: #00d9ff;
            background: #1a2a4e;
        }

        .example-card h4 {
            color: #00d9ff;
            margin-bottom: 0.5rem;
        }

        .example-card p {
            color: #888;
            font-size: 0.85rem;
        }

        .divider {
            max-width: 600px;
            margin: 0 auto 2rem;
            text-align: center;
            color: #555;
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            display: inline-block;
            width: 80px;
            height: 1px;
            background: #333;
            vertical-align: middle;
            margin: 0 1rem;
        }
    </style>
</head>
<body>
    <h1>FMU Explorer</h1>

    <div class="step-indicator">
        <span class="step active" id="step1">1. Upload FMU</span>
        <span class="step" id="step2">2. Upload Data</span>
        <span class="step" id="step3">3. Run Simulation</span>
    </div>

    <div class="examples-section" id="examples-section">
        <h3>Try an Example</h3>
        <div class="example-cards" id="example-cards">
            <!-- Populated by JavaScript -->
        </div>
    </div>

    <div class="divider">or upload your own</div>

    <div class="drop-zone" id="drop-zone-fmu">
        <p>Drag & drop an FMU file here</p>
        <small>or click to select a file</small>
        <input type="file" id="file-input-fmu" accept=".fmu">
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p id="loading-text">Analyzing FMU...</p>
    </div>

    <div class="error" id="error"></div>

    <div class="results" id="results">
        <div class="model-info" id="model-info"></div>
        <div id="variables-container"></div>

        <!-- CSV Section -->
        <div class="csv-section" id="csv-section">
            <h3 style="text-align: center; margin-bottom: 1rem;">Step 2: Upload Input Data</h3>

            <div class="csv-actions">
                <button class="btn btn-primary" id="download-sample-btn">Download Sample CSV</button>
            </div>

            <div class="drop-zone drop-zone-csv" id="drop-zone-csv">
                <p>Drag & drop a CSV file here</p>
                <small>or click to select a file</small>
                <input type="file" id="file-input-csv" accept=".csv">
            </div>

            <div class="validation-status" id="validation-status"></div>

            <div class="data-section" id="input-data-section">
                <div class="table-container">
                    <h4>Input Data</h4>
                    <table class="data-table" id="input-data-table"></table>
                </div>

                <div style="text-align: center; margin: 2rem 0;">
                    <button class="btn btn-success" id="run-btn" disabled>Run Simulation</button>
                </div>
            </div>

            <div class="data-section" id="output-data-section">
                <div class="table-container output-section">
                    <h4>Simulation Output</h4>
                    <table class="data-table" id="output-data-table"></table>
                </div>

                <div class="chart-container">
                    <h4>Output Chart</h4>
                    <canvas id="output-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentCsvFile = null;
        let csvValid = false;
        let outputChart = null;

        // Elements
        const dropZoneFmu = document.getElementById('drop-zone-fmu');
        const dropZoneCsv = document.getElementById('drop-zone-csv');
        const fileInputFmu = document.getElementById('file-input-fmu');
        const fileInputCsv = document.getElementById('file-input-csv');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        const modelInfo = document.getElementById('model-info');
        const variablesContainer = document.getElementById('variables-container');
        const csvSection = document.getElementById('csv-section');
        const validationStatus = document.getElementById('validation-status');
        const inputDataSection = document.getElementById('input-data-section');
        const outputDataSection = document.getElementById('output-data-section');
        const inputDataTable = document.getElementById('input-data-table');
        const outputDataTable = document.getElementById('output-data-table');
        const downloadSampleBtn = document.getElementById('download-sample-btn');
        const runBtn = document.getElementById('run-btn');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const exampleCards = document.getElementById('example-cards');

        // Load example FMUs on page load
        async function loadExamples() {
            try {
                const response = await fetch('/examples');
                const data = await response.json();

                if (data.success && data.examples.length > 0) {
                    exampleCards.innerHTML = data.examples.map(ex => `
                        <div class="example-card" data-id="${ex.id}">
                            <h4>${ex.name}</h4>
                            <p>${ex.description}</p>
                        </div>
                    `).join('');

                    // Add click handlers
                    document.querySelectorAll('.example-card').forEach(card => {
                        card.addEventListener('click', () => loadExample(card.dataset.id));
                    });
                }
            } catch (err) {
                console.error('Failed to load examples:', err);
            }
        }

        async function loadExample(exampleId) {
            loading.classList.add('active');
            loadingText.textContent = 'Loading example FMU...';
            results.classList.remove('active');
            error.classList.remove('active');
            csvSection.classList.remove('active');
            inputDataSection.classList.remove('active');
            outputDataSection.classList.remove('active');

            try {
                const response = await fetch(`/load-example/${exampleId}`, {
                    method: 'POST'
                });

                const data = await response.json();
                loading.classList.remove('active');

                if (data.error) {
                    showError(data.error);
                    return;
                }

                displayFmuResults(data);

                // Show CSV section
                csvSection.classList.add('active');

                // Update steps
                step1.classList.remove('active');
                step1.classList.add('completed');
                step2.classList.add('active');

            } catch (err) {
                loading.classList.remove('active');
                showError('Failed to load example: ' + err.message);
            }
        }

        // Load examples on page load
        loadExamples();

        // FMU Upload handlers
        dropZoneFmu.addEventListener('click', () => fileInputFmu.click());

        dropZoneFmu.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZoneFmu.classList.add('dragover');
        });

        dropZoneFmu.addEventListener('dragleave', () => {
            dropZoneFmu.classList.remove('dragover');
        });

        dropZoneFmu.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZoneFmu.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFmuFile(e.dataTransfer.files[0]);
            }
        });

        fileInputFmu.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFmuFile(e.target.files[0]);
            }
        });

        // CSV Upload handlers
        dropZoneCsv.addEventListener('click', () => fileInputCsv.click());

        dropZoneCsv.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZoneCsv.classList.add('dragover');
        });

        dropZoneCsv.addEventListener('dragleave', () => {
            dropZoneCsv.classList.remove('dragover');
        });

        dropZoneCsv.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZoneCsv.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleCsvFile(e.dataTransfer.files[0]);
            }
        });

        fileInputCsv.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleCsvFile(e.target.files[0]);
            }
        });

        // Download sample CSV
        downloadSampleBtn.addEventListener('click', async () => {
            try {
                const response = await fetch('/sample-csv');
                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                // Create and download file
                const blob = new Blob([data.csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = data.filename;
                a.click();
                URL.revokeObjectURL(url);
            } catch (err) {
                showError('Failed to download sample: ' + err.message);
            }
        });

        // Run simulation
        runBtn.addEventListener('click', async () => {
            if (!currentCsvFile || !csvValid) return;

            loadingText.textContent = 'Running simulation...';
            loading.classList.add('active');
            outputDataSection.classList.remove('active');

            const formData = new FormData();
            formData.append('csv', currentCsvFile);

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                loading.classList.remove('active');

                if (data.error) {
                    showError(data.error);
                    return;
                }

                // Display output data
                displayOutputData(data.outputData, data.outputColumns);

                // Update steps
                step3.classList.add('completed');

            } catch (err) {
                loading.classList.remove('active');
                showError('Simulation failed: ' + err.message);
            }
        });

        async function handleFmuFile(file) {
            loading.classList.add('active');
            loadingText.textContent = 'Analyzing FMU...';
            results.classList.remove('active');
            error.classList.remove('active');
            csvSection.classList.remove('active');
            inputDataSection.classList.remove('active');
            outputDataSection.classList.remove('active');

            const formData = new FormData();
            formData.append('fmu', file);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                loading.classList.remove('active');

                if (data.error) {
                    showError(data.error);
                    return;
                }

                displayFmuResults(data);

                // Show CSV section
                csvSection.classList.add('active');

                // Update steps
                step1.classList.remove('active');
                step1.classList.add('completed');
                step2.classList.add('active');

            } catch (err) {
                loading.classList.remove('active');
                showError('Failed to analyze FMU: ' + err.message);
            }
        }

        async function handleCsvFile(file) {
            currentCsvFile = file;
            loading.classList.add('active');
            loadingText.textContent = 'Validating CSV...';
            validationStatus.classList.remove('active', 'valid', 'invalid');
            inputDataSection.classList.remove('active');
            outputDataSection.classList.remove('active');

            const formData = new FormData();
            formData.append('csv', file);

            try {
                const response = await fetch('/validate-csv', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                loading.classList.remove('active');

                if (data.error) {
                    showError(data.error);
                    return;
                }

                // Show validation status
                validationStatus.classList.add('active');
                csvValid = data.valid;

                if (data.valid) {
                    validationStatus.classList.add('valid');
                    validationStatus.innerHTML = `
                        <strong>CSV Valid!</strong> Found ${data.rowCount} rows with all required inputs.
                        ${data.extraColumns.length > 0 ? `<br><small>Extra columns (ignored): ${data.extraColumns.join(', ')}</small>` : ''}
                    `;
                    runBtn.disabled = false;

                    // Update steps
                    step2.classList.remove('active');
                    step2.classList.add('completed');
                    step3.classList.add('active');
                } else {
                    validationStatus.classList.add('invalid');
                    validationStatus.innerHTML = `
                        <strong>CSV Invalid!</strong> Missing required inputs: ${data.missingInputs.join(', ')}
                        <br><small>Download the sample CSV to see the required format.</small>
                    `;
                    runBtn.disabled = true;
                }

                // Display input data
                displayInputData(data.data, data.headers);

            } catch (err) {
                loading.classList.remove('active');
                showError('Failed to validate CSV: ' + err.message);
            }
        }

        function displayFmuResults(data) {
            // Display model info
            modelInfo.innerHTML = `
                <h2>${data.modelInfo.modelName}</h2>
                <p><span>FMI Version:</span> ${data.modelInfo.fmiVersion}</p>
                ${data.modelInfo.description ? `<p><span>Description:</span> ${data.modelInfo.description}</p>` : ''}
                ${data.modelInfo.generationTool ? `<p><span>Generated by:</span> ${data.modelInfo.generationTool}</p>` : ''}
            `;

            // Display variables
            const categories = [
                { key: 'inputs', label: 'Inputs', icon: '&#8594;' },
                { key: 'outputs', label: 'Outputs', icon: '&#8592;' },
                { key: 'parameters', label: 'Parameters', icon: '&#9881;' },
                { key: 'local', label: 'Local Variables', icon: '&#8226;' },
                { key: 'other', label: 'Other', icon: '&#8226;' }
            ];

            variablesContainer.innerHTML = '';

            for (const cat of categories) {
                const vars = data.variables[cat.key];
                if (vars.length === 0) continue;

                const section = document.createElement('div');
                section.className = 'variable-section';
                section.innerHTML = `
                    <div class="section-header">
                        <h3>${cat.icon} ${cat.label} <span class="count-badge">${vars.length}</span></h3>
                        <span class="arrow">&#9660;</span>
                    </div>
                    <div class="section-content">
                        <table class="variable-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Type</th>
                                    <th>Start Value</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${vars.map(v => `
                                    <tr>
                                        <td><strong>${v.name}</strong></td>
                                        <td><span class="type-badge">${v.type}</span></td>
                                        <td>${v.start !== null ? v.start : '-'}</td>
                                        <td>${v.description || '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;

                const header = section.querySelector('.section-header');
                const content = section.querySelector('.section-content');
                const arrow = section.querySelector('.arrow');

                if (cat.key === 'inputs' || cat.key === 'outputs') {
                    content.classList.add('expanded');
                    arrow.classList.add('rotated');
                }

                header.addEventListener('click', () => {
                    content.classList.toggle('expanded');
                    arrow.classList.toggle('rotated');
                });

                variablesContainer.appendChild(section);
            }

            results.classList.add('active');
        }

        function displayInputData(data, headers) {
            if (!data || data.length === 0) return;

            inputDataTable.innerHTML = `
                <thead>
                    <tr>
                        ${headers.map(h => `<th>${h}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${data.map(row => `
                        <tr>
                            ${headers.map(h => `<td>${row[h] || '-'}</td>`).join('')}
                        </tr>
                    `).join('')}
                </tbody>
            `;

            inputDataSection.classList.add('active');
        }

        function displayOutputData(data, columns) {
            if (!data || data.length === 0) return;

            outputDataTable.innerHTML = `
                <thead>
                    <tr>
                        ${columns.map(c => `<th>${c}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${data.map(row => `
                        <tr>
                            ${columns.map(c => `<td>${row[c] !== undefined ? row[c].toFixed(6) : '-'}</td>`).join('')}
                        </tr>
                    `).join('')}
                </tbody>
            `;

            // Create chart
            const ctx = document.getElementById('output-chart').getContext('2d');

            // Destroy existing chart if any
            if (outputChart) {
                outputChart.destroy();
            }

            // Prepare data for chart
            const timeData = data.map(row => row.time);
            const outputColumns = columns.filter(c => c !== 'time');

            const colors = ['#00d9ff', '#4CAF50', '#ff9800', '#e91e63', '#9c27b0'];

            const datasets = outputColumns.map((col, i) => ({
                label: col,
                data: data.map(row => row[col]),
                borderColor: colors[i % colors.length],
                backgroundColor: colors[i % colors.length] + '20',
                tension: 0.3,
                fill: false
            }));

            outputChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: timeData,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: { color: '#eee' }
                        }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Time', color: '#888' },
                            ticks: { color: '#888' },
                            grid: { color: '#333' }
                        },
                        y: {
                            title: { display: true, text: 'Value', color: '#888' },
                            ticks: { color: '#888' },
                            grid: { color: '#333' }
                        }
                    }
                }
            });

            outputDataSection.classList.add('active');
        }

        function showError(message) {
            error.textContent = message;
            error.classList.add('active');
        }
    </script>
</body>
</html>
